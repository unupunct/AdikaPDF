<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Blue Gradient -->
    <linearGradient id="adikaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="adikaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- LOGO ICON -->
  <g transform="translate(10, 10)" filter="url(#softShadow)">
    <!-- Document Background Shape -->
    <path d="M 20 5 
             C 20 2, 22 0, 25 0 
             L 70 0 
             L 95 25 
             L 95 95 
             C 95 98, 93 100, 90 100 
             L 25 100 
             C 22 100, 20 98, 20 95 
             Z" 
          fill="url(#adikaBlue)" />

    <!-- Folded Corner -->
    <path d="M 70 0 L 70 20 C 70 23, 72 25, 75 25 L 95 25 Z" 
          fill="#0369A1" opacity="0.6" />

    <!-- Stylized 'A' + Nib (Negative Space Cutout & Overlay) -->
    <path d="M 57.5 28 
             L 73 72 
             C 74 75, 72 78, 68 78 
             L 62 78 
             L 57.5 64 
             L 42.5 64 
             L 38 78 
             L 32 78 
             C 28 78, 26 75, 27 72 
             L 42.5 28 
             C 44.5 22, 55.5 22, 57.5 28 Z 
             M 50 38 
             L 45.5 54 
             L 54.5 54 
             Z" 
          fill="#FFFFFF" />

    <!-- Pen Nib / E-Sign Pen Accent -->
    <path d="M 64 62 L 78 76 L 86 68 L 72 54 Z" fill="url(#adikaAccent)" />
    <circle cx="81" cy="71" r="2" fill="#FFFFFF" />
  </g>

  <!-- LOGO TEXT -->
  <!-- Main Brand Name -->
  <text x="130" y="68" 
        font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" 
        font-size="52" 
        font-weight="800" 
        fill="#0F172A" 
        letter-spacing="-1">Adika</text>

  <!-- Subtitle / Product Function -->
  <text x="132" y="94" 
        font-family="'Inter', 'Segoe UI', sans-serif" 
        font-size="16" 
        font-weight="700" 
        fill="#0284C7" 
        letter-spacing="4.5">PDF EDITOR</text>
  
  <!-- Subtle Dot Accent -->
  <circle cx="282" cy="60" r="5" fill="url(#adikaAccent)" />
</svg>
